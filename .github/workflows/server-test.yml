# server/ 자동 테스트: lint + pytest. server/ 를 바꾸는 PR(develop·main 대상)에서 돈다.
name: server-test

on:
  pull_request:
    branches: [develop, main]
    paths: ["server/**", ".github/workflows/server-test.yml"]
  push:
    branches: [develop, main]
    paths: ["server/**", ".github/workflows/server-test.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -v
