# PR 제목 규칙 검사: 앞에 feat: · fix: 같은 종류를 붙인다 (11/6 회의에서 정한 커밋 · PR 규칙).
# 제목이 규칙에 맞지 않으면 실패하고, 제목만 고치면 다시 돈다.
name: pr-title

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, reopened, synchronize]

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - name: 제목 앞에 종류가 붙었는지
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR 제목: $TITLE"
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|refactor|test|chore|ci|style|perf|merge)(\([^)]+\))?: .+'; then
            echo "::error::PR 제목 앞에 종류를 붙여 주세요. 예: 'feat: 영수증 사진 읽기', 'fix: 확정 버튼 오류'"
            echo "쓸 수 있는 종류: feat fix docs refactor test chore ci style perf merge"
            exit 1
          fi
