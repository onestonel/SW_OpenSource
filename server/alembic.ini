# DB 마이그레이션 설정. DB 주소는 여기가 아니라 DATABASE_URL 환경 변수에서 읽는다 (migrations/env.py).
#   alembic upgrade head                         최신으로 올리기 (서버가 켜질 때도 자동으로 한다)
#   alembic revision --autogenerate -m "설명"     모델을 바꾼 뒤 마이그레이션 파일 만들기
[alembic]
script_location = migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
